[project]
name = "impasse"
version = "0.1.0"
description = "Small local LLM learning to debug through a growing skill library (stack-based TOTE orchestration)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
