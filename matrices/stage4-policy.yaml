# Detector-policy selection on val (user decision: pick one policy by val, stage 4).
series: stage4-policy
models: [qwen-9b, qwen-4b]
seeds: [1, 2, 3]
splits: [val]
common: {max_llm_calls: 150}
configs:
  - {id: B1-strict, detector_policy: strict}
  - {id: B1-lenient, detector_policy: lenient}
  - {id: B2-strict, detector_policy: strict, skills: skills, library: skills-v0}
  - {id: B2-lenient, detector_policy: lenient, skills: skills, library: skills-v0}
